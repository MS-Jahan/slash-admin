server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # MSW service worker must never be cached, otherwise updates will not apply
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Entry HTML must always be revalidated so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: the app uses createBrowserRouter (history mode),
    # so unknown paths such as /workbench must return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
